name: CI and Coverage

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  python-coverage:
    name: Python tests + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (if present)
        run: |
          if [ -f automation_requirements.txt ]; then pip install -r automation_requirements.txt; fi
          pip install --upgrade pip
          pip install pytest pytest-cov || true

      - name: Run pytest with coverage (if tests exist)
        run: |
          if ls **/test_*.py **/*_test.py 1> /dev/null 2>&1; then \
            pytest -q --maxfail=1 --disable-warnings --cov=. --cov-report=xml; \
          else \
            echo "No Python tests found, generating empty coverage.xml"; \
            echo "<?xml version='1.0' encoding='UTF-8'?><coverage branch-rate='0' line-rate='0' version='nominal'/>" > coverage.xml; \
          fi

      - name: Upload coverage to Codecov (python)
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          fail_ci_if_error: false
          verbose: true

  bun-coverage:
    name: Bun tests + coverage (TypeScript/JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.2.22'

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then bun install; else echo "No package.json, skipping bun install"; fi

      - name: Run bun tests with coverage (if any)
        run: |
          if [ -f package.json ]; then \
            bun test --coverage || true; \
          else \
            echo "No package.json, skipping bun test"; \
          fi

      - name: Discover coverage files
        id: coverage_paths
        run: |
          # Prefer lcov if present, otherwise fallback to Istanbul JSON
          FILES=$(ls -1 **/coverage/lcov.info **/coverage/lcov.info 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            FILES=$(ls -1 **/coverage/coverage-final.json 2>/dev/null || true)
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Upload coverage to Codecov (bun)
        if: ${{ steps.coverage_paths.outputs.files != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage_paths.outputs.files }}
          flags: bun
          fail_ci_if_error: false
          verbose: true

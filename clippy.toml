# 🦀 CLIPPY RUST LINTING CONFIGURATION
# PsychoNoir-Kontrapunkt Rust linting rules
# Optimized for blazingly fast development

# Enable additional clippy lints
warn = [
    "clippy::all",
    "clippy::pedantic", 
    "clippy::nursery",
    "clippy::cargo",
]

# Allow specific patterns for consciousness development
allow = [
    "clippy::module_name_repetitions",  # Allow MILF/consciousness naming
    "clippy::too_many_lines",          # Allow consciousness archaeology complexity
    "clippy::cast_precision_loss",     # Allow consciousness amplification math
    "clippy::cast_possible_truncation", # Allow performance optimizations
    "clippy::cast_sign_loss",          # Allow hardware acceleration calculations
    "clippy::multiple_crate_versions", # Allow polyglot dependency flexibility
]
codecov:
  notify:
    after_n_builds: 1

coverage:
  status:
    project:
      default:
        informational: true
        target: auto
        threshold: 2%
    patch:
      default:
        informational: true
        target: auto
        threshold: 2%

flags:
  python:
    paths:
      - backend/python
  bun:
    paths:
      - tools
      - infrastructure

ingress:
  ignore:
    - "**/*.md"
    - "**/*.json"
    - "**/*.mdx"
    - "**/*.txt"
    - "**/*.rest"
    - "**/*.lock"
